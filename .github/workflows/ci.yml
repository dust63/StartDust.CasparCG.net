name: ci

on:
  pull_request:
  push:
    branches: [ master, main, design/**, feature/** ]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore src/StarDust.CasparCG.UnitTests/StarDust.CasparCG.UnitTests.csproj
      - run: dotnet restore src/StarDust.CasparCG.IntegrationTests/StarDust.CasparCG.IntegrationTests.csproj
      - run: dotnet build src/StarDust.CasparCG.UnitTests/StarDust.CasparCG.UnitTests.csproj --configuration Release --no-restore
      - run: dotnet build src/StarDust.CasparCG.IntegrationTests/StarDust.CasparCG.IntegrationTests.csproj --configuration Release --no-restore
      - run: dotnet test src/StarDust.CasparCG.UnitTests/StarDust.CasparCG.UnitTests.csproj --configuration Release --no-build --logger trx
      - run: dotnet test src/StarDust.CasparCG.IntegrationTests/StarDust.CasparCG.IntegrationTests.csproj --configuration Release --no-build --logger trx
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: "**/*.trx"
